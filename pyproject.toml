[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "oxidize-pdf"
version = "0.4.3"
description = "Python bindings for oxidize-pdf — generate, parse, split, merge, and manipulate PDF files"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Santiago Fernández Muñoz" },
]
keywords = ["pdf", "pdf-generation", "pdf-parser", "pdf-merge", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/bzsanti/oxidize-python"
Repository = "https://github.com/bzsanti/oxidize-python"
Issues = "https://github.com/bzsanti/oxidize-python/issues"
Changelog = "https://github.com/bzsanti/oxidize-python/releases"
Documentation = "https://github.com/bzsanti/oxidize-python#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
]
mcp = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
]
# Note: MCP tests (tests/mcp_tests/) require both extras:
#   pip install -e ".[dev,mcp]"

[project.scripts]
oxidize-mcp = "oxidize_pdf.mcp.server:run"

[tool.maturin]
python-source = "python"
module-name = "oxidize_pdf._oxidize_pdf"
features = ["pyo3/extension-module"]
python-packages = ["oxidize_pdf"]

[tool.mypy]
exclude = ["oxidize_pdf/mcp/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
