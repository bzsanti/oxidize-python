name: Bug report
description: Report incorrect behavior in the oxidize-pdf Python binding
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please verify real behavior
        and provide a minimal reproduction — not just a stack trace.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe, and what did you expect instead?
      placeholder: Describe the actual vs expected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short Python snippet that reproduces the issue. Attach the input PDF if relevant.
      render: python
      placeholder: |
        import oxidize_pdf as op
        reader = op.PdfReader.open("input.pdf")
        ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: oxidize-pdf version
      description: Output of `pip show oxidize-pdf` (Version field).
      placeholder: "0.8.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 14 / Windows 11"
    validations:
      required: true
