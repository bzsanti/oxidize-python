[package]
name = "oxidize-python"
version = "0.11.0"
edition = "2021"
rust-version = "1.88"
authors = ["Santiago Fernández Muñoz"]
license = "MIT"
description = "Python bindings for oxidize-pdf - A pure Rust PDF generation and manipulation library"

[lib]
name = "_oxidize_pdf"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"] }
oxidize-pdf = { version = "=2.16.3", default-features = false, features = ["compression", "signatures", "semantic", "language-detection", "unstable-spi"] }
serde_json = "1"
tempfile = "3"
chrono = "0.4"
